# SCA-YOLO.yaml -  Stable Version
nc: 10

# 这里的缩进必须严格，n 前面是两个空格
scales:
  n: [0.33, 0.25, 1024]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]    # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]   # 1-P2/4
  - [-1, 3, C2f_AK, [128, True]] # 2
  - [-1, 1, Conv, [256, 3, 2]]   # 3-P3/8
  - [-1, 6, C2f_AK, [256, True]] # 4
  - [-1, 1, Conv, [512, 3, 2]]   # 5-P4/16
  - [-1, 6, C2f_AK, [512, True]] # 6
  - [-1, 1, Conv, [1024, 3, 2]]  # 7-P5/32
  - [-1, 3, C2f_AK, [1024, True]] # 8
  - [-1, 1, SPPF, [1024, 5]]     # 9

# 注意：合并所有层到 head 下，严禁出现 neck: 关键字
head:
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 10
  - [[-1, 6], 1, Concat, [1]]                  # 11
  - [-1, 3, C2f_AK, [512]]                        # 12
  - [-1, 1, CoordAtt, [512, 512]]              # 13

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 14
  - [[-1, 4], 1, Concat, [1]]                  # 15
  - [-1, 3, C2f_AK, [256]]                        # 16
  - [-1, 1, CoordAtt, [256, 256]]              # 17 (P3 输出)

  - [-1, 1, Conv, [256, 3, 2]]                 # 18
  - [[-1, 13], 1, Concat, [1]]                 # 19
  - [-1, 3, C2f_AK, [512]]                        # 20 (P4 输出)

  - [-1, 1, Conv, [512, 3, 2]]                 # 21
  - [[-1, 9], 1, Concat, [1]]                  # 22
  - [-1, 3, C2f_AK, [1024]]                       # 23 (P5 输出)

  - [[17, 20, 23], 1, Detect, [nc]]            # 24: 完美对应上述索引