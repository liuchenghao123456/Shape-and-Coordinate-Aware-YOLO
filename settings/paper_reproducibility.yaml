environment:
  system: Windows 11 25H2
  gpu: NVIDIA RTX 5060 Ti (16GB GDDR7)
  cpu: Intel Core i7-14700 (20 cores)
  python: 3.11.14
  pytorch: 2.10.0.dev20251207+cu130
  ultralytics: 8.3.235

training:
  imgsz: 640
  epochs: 300
  batch: 16
  workers: 6
  seeds: [0, 1, 2]
  optimizer: auto
  lr0: 0.01
  lrf: 0.01
  momentum: 0.937
  weight_decay: 0.0005
  amp: true

augmentation:
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4
  translate: 0.1
  scale: 0.5
  fliplr: 0.5
  mosaic: 1.0
  close_mosaic: 10
  degrees: 0.0
  shear: 0.0
  perspective: 0.0
  mixup: 0.0
  cutmix: 0.0
  copy_paste: 0.0

validation:
  iou: 0.7
  agnostic_nms: false
  max_det: 300
  precision: FP32
  half: false
  tensorrt: false
  int8: false
